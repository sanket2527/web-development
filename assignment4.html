<!DOCTYPE html>
<html>
    <head>
        <font face="Lato" size="4">Roll no-40</font>
        <title>HTML Lists</title>
    </head>
    <body>
        <h1>Ordered Lists</h1>
        <ol>
            <li>Apple</li>
            <li>Mango</li>
            <li>Litchi</li>
            <li>Orange</li>
            <li>Pears</li>
        </ol>
        <h1>Unordered List</h1>
        <ul>
            <li>Sugar</li>
            <li>Salt</li>
            <li>Sour</li>
        </ul>
        <h1>Defination List</h1>
        <dl>
            <dt>Cristiano Ronaldo</dt>
            <dd>CR is a GOAT</dd>
        </dl>
    </body>
</html>
